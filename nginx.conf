# nginx.conf — TypingCenterNear.me
# Deployed and managed by Coolify on Hetzner VPS
# Preserves 100% of WordPress sitemap URLs

server {
    listen 80;
    server_name typingcenternear.me www.typingcenternear.me;
    root /var/www/public;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache static assets 1 year (immutable)
    location ~* \.(css|js|jpg|jpeg|webp|png|svg|woff2|woff|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # City listing pages /typing-center-{emirate}/
    location ~ ^/typing-center-(dubai|abu-dhabi|sharjah|ajman|ras-al-khaimah|fujairah|umm-al-quwain)/$ {
        try_files $uri $uri/index.html /typing-center-dubai/index.html;
    }

    # Individual center pages (slug detected by JS)
    location ~ ^/typing-center-[a-z-]+/[a-z0-9-]+/$ {
        try_files $uri /center.html;
    }

    # WordPress legacy URLs preserved for SEO
    location ~ ^/(how-to-|emirates-id-|check-your-|family-visa-|renew-your-|apply-for-|types-of-|complete-guide-|best-typing-|top-|uae-) {
        try_files $uri /post.html;
    }

    # Blog
    location /blog/ {
        try_files $uri $uri/ /blog/index.html;
    }

    # Search
    location /search/ {
        try_files $uri /search.html;
    }

    # Admin SPA
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Sitemaps
    location = /sitemap.xml       { try_files $uri =404; }
    location = /sitemap-centers.xml { try_files $uri =404; }
    location = /sitemap-blog.xml  { try_files $uri =404; }
    location = /sitemap-cities.xml { try_files $uri =404; }
    location = /robots.txt        { try_files $uri =404; }

    # General fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
